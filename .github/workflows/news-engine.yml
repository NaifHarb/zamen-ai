name: Test news engine
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zamen-news
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: python -m compileall scripts
      - name: Collect and enrich news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/news.py
      - name: Save news
        run: |
          git config user.name "zamen-ai[bot]"
          git config user.email "zamen-ai[bot]@users.noreply.github.com"
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update news dataset"
            git push
          fi
