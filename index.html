<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>زامن | ZAMEN</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{color-scheme:light;--bg:#f7f5f0;--ink:#191919;--muted:#686868;--accent:#a51e32;--line:#d8d5d0}html.dark{color-scheme:dark;--bg:#111;--ink:#f5f1eb;--muted:#b4b4b4;--accent:#ff6269;--line:#353535}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}header,main,footer{max-width:850px;margin:auto;padding:16px 20px}header{border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font:bold 30px Georgia,serif;color:var(--accent);text-decoration:none}.brand span{color:var(--ink);font-size:23px}button,input{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);padding:8px 12px;border-radius:5px}button{cursor:pointer}nav{display:flex;gap:20px;overflow:auto;white-space:nowrap;margin-top:18px}nav button{border:0;border-radius:0;padding:8px 0}nav button.active{color:var(--accent);border-bottom:2px solid var(--accent)}a{color:inherit}small,.meta,footer{color:var(--muted);font-size:13px}.tag{color:var(--accent);font-size:13px;font-weight:bold}h1,h2,p{margin:0}h1{font-size:clamp(27px,5vw,42px);line-height:1.45}h2{font-size:19px;line-height:1.55}p{line-height:1.9}#search{width:100%;margin:12px 0}article{border-bottom:1px solid var(--line);padding:18px 0;display:flex;gap:15px;align-items:start}article .copy{flex:1;min-width:0}article a{text-decoration:none}article a:hover{text-decoration:underline}article img,article .placeholder{width:32%;aspect-ratio:4/3;object-fit:cover;border-radius:4px}article.lead{display:block}article.lead img,article.lead .placeholder{width:100%;aspect-ratio:16/9;margin-bottom:12px}article.lead h2{font-size:clamp(25px,4vw,34px)}.placeholder{display:grid;place-items:center;background:var(--line);color:var(--muted);font: bold 22px Georgia,serif}.meta{margin-top:9px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}.meta button{border:0;padding:3px;color:var(--accent)}.reader{max-width:720px;margin:auto}.reader h1{margin:12px 0}.reader .intro{font-size:19px;color:var(--muted)}.reader img{width:100%;max-height:440px;object-fit:cover;border-radius:4px;margin:24px 0}.reader .body{white-space:pre-wrap;font-size:19px;margin:22px 0}.reader .original{display:inline-block;color:var(--accent);margin:18px 0}footer{border-top:1px solid var(--line)}[hidden]{display:none!important}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
</style></head><body><header><div class="top"><button id="theme" aria-label="تبديل المظهر">◐</button><a class="brand" href="./">زامن <span>| ZAMEN</span></a><button id="searchToggle" aria-label="البحث">بحث</button></div><nav id="nav"></nav></header><main><section id="feed"><div class="top"><small id="heading">آخر الأخبار</small><small id="status" role="status">جاري التحميل</small></div><input id="search" type="search" placeholder="ابحث في الأخبار" aria-label="البحث" hidden><div id="news"></div></section><section id="reader" class="reader" hidden></section></main><footer>زامن · ملخصات إخبارية من المصادر الأصلية</footer><script>
const $=id=>document.getElementById(id),read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}},el=(t,s='',c='')=>{const n=document.createElement(t);n.textContent=s;n.className=c;return n};let items=[],images={},category='الكل';const fav=new Set(read('zamen-fav',[]));document.documentElement.classList.toggle('dark',read('zamen-dark',matchMedia('(prefers-color-scheme: dark)').matches));$('theme').onclick=()=>save('zamen-dark',document.documentElement.classList.toggle('dark'));$('searchToggle').onclick=()=>{if($('feed').hidden){location.href='./?search=1';return}$('search').hidden=!$('search').hidden;if(!$('search').hidden)$('search').focus()};const params=new URLSearchParams(location.search),id=params.get('article');if(params.has('search'))$('search').hidden=false;
function safe(v){try{const u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function group(x){const c=x.category||'أخرى';if(/سياس/.test(c))return 'السياسة';if(/اشتراك|عروض/.test(c))return 'الاشتراكات';if(/أدوات/.test(c))return 'أدوات';if(/ذكاء|تقنية|سيبراني/.test(c))return 'الذكاء الاصطناعي والتقنية';return c}
function date(x){const d=new Date(x.published_at);return isNaN(d)?'':d.toLocaleDateString('ar-SA',{calendar:'gregory',timeZone:'Asia/Riyadh',day:'numeric',month:'short',year:'numeric'})}
function photo(x,placeholder=true){const u=safe(x.image_url||x.image||images[x.id]);const fallback=()=>el('div','زامن','placeholder');if(!u)return placeholder?fallback():null;const i=el('img');i.src=u;i.alt='صورة من المصدر';i.loading='lazy';i.referrerPolicy='no-referrer';i.onerror=()=>placeholder?i.replaceWith(fallback()):i.remove();return i}
function bookmark(x,refresh){const b=el('button',fav.has(x.id)?'★':'☆');b.setAttribute('aria-label','حفظ الخبر');b.setAttribute('aria-pressed',String(fav.has(x.id)));b.onclick=()=>{fav.has(x.id)?fav.delete(x.id):fav.add(x.id);save('zamen-fav',[...fav]);refresh()};return b}
function meta(x,refresh){const m=el('div','','meta');m.append(el('span',x.source||''),el('span',date(x)),bookmark(x,refresh));return m}
function nav(){ $('nav').replaceChildren();for(const c of ['الكل',...new Set(['السياسة',...items.map(group)]),'المفضلة']){const b=el('button',c,c===category?'active':'');b.onclick=()=>{if(id){location.href='./?category='+encodeURIComponent(c);return}category=c;nav();render()};$('nav').append(b)}}
function render(){const q=$('search').value.toLowerCase();const list=items.filter(x=>(category==='الكل'||category==='المفضلة'&&fav.has(x.id)||group(x)===category)&&[x.title_ar,x.original_title,x.summary_ar,x.excerpt,x.source].join(' ').toLowerCase().includes(q));$('heading').textContent=category==='الكل'?'آخر الأخبار':category;$('status').textContent=list.length+' خبر';$('news').replaceChildren();list.forEach((x,i)=>{const a=el('article','',i===0?'lead':'');const url='?article='+encodeURIComponent(x.id);const pic=photo(x);const pl=el('a');pl.href=url;pl.style.display='contents';pl.append(pic);const copy=el('div','','copy');const h=el('h2'),l=el('a',x.title_ar||x.original_title||'خبر');l.href=url;h.append(l);copy.append(el('div',group(x),'tag'),h,meta(x,render));a.append(pl,copy);$('news').append(a)});if(!list.length)$('news').append(el('p','لا توجد أخبار هنا'))}
function reader(){ $('feed').hidden=true;$('reader').hidden=false;const r=$('reader');r.replaceChildren();const back=el('a','← العودة للأخبار');back.href='./';r.append(back);const x=items.find(x=>String(x.id)===id);if(!x){r.append(el('p','لم يعد الخبر متاحًا'));return}const title=x.title_ar||x.original_title||'خبر';document.title=title+' | زامن';r.append(el('p',group(x),'tag'),el('h1',title),meta(x,reader));const pic=photo(x,false);if(pic)r.append(pic);r.append(el('p',x.summary_ar||x.excerpt||'لا يوجد ملخص متاح','body'),el('small',x.summary_ar?'ملخص عربي من المصدر':'مقتطف المصدر'));const u=safe(x.article_url);if(u){const a=el('a','قراءة الخبر الكامل في المصدر ↗','original');a.href=u;a.target='_blank';a.rel='noopener noreferrer';r.append(el('div'),a)}if(navigator.share){const b=el('button','مشاركة');b.onclick=()=>navigator.share({title,url:location.href}).catch(()=>{});r.append(el('div'),b)}}
$('search').oninput=render;category=params.get('category')||'الكل';const load=p=>fetch(p,{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error(p);return r.json()});Promise.allSettled([load('data/news.json'),load('data/sheets-news.json'),load('data/images.json')]).then(([a,b,c])=>{if(a.status==='rejected'&&b.status==='rejected')throw Error('news');items=[...new Map([...(a.value?.items||[]),...(b.value?.items||[])].map(x=>[x.id,x])).values()].sort((a,b)=>(Date.parse(b.published_at)||0)-(Date.parse(a.published_at)||0));images=c.value||{};nav();id?reader():render()}).catch(()=>{$('status').textContent='تعذر تحميل الأخبار'});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
