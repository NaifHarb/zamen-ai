const $=id=>document.getElementById(id);let items=[],category="الكل";const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};let fav=new Set(read("zamen-fav",[]));const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};document.documentElement.classList.toggle("dark",read("zamen-dark",matchMedia("(prefers-color-scheme: dark)").matches));$("theme").onclick=()=>save("zamen-dark",document.documentElement.classList.toggle("dark"));const el=(tag,txt,cls)=>{let n=document.createElement(tag);n.textContent=txt;if(cls)n.className=cls;return n};function link(x){let a=el("a","المصدر الأصلي");try{let u=new URL(x.article_url);if(["https:","http:"].includes(u.protocol))a.href=u.href}catch{}a.target="_blank";a.rel="noopener noreferrer";return a}function openNews(x){let d=$("detail");d.replaceChildren(el("small",x.source+" · "+x.category),el("h2",x.title_ar||x.original_title),el("p",x.summary_ar||x.excerpt||"لا يوجد مقتطف"),el("small",x.summary_ar?(x.model==="gemini-task-mode"?"ملخص Gemini Task Mode":"ملخص آلي من مقتطف المصدر"):"مقتطف أصلي، بانتظار المعالجة"),el("p",x.published_at||""),link(x));$("reader").showModal()}$("close").onclick=()=>$("reader").close();function render(){let q=$("search").value.toLowerCase();let filtered=items.filter(x=>(category==="الكل"||category==="المفضلة"&&fav.has(x.id)||category===x.category)&&[x.title_ar,x.original_title,x.summary_ar,x.excerpt,x.source].join(" ").toLowerCase().includes(q));$("heading").textContent=category==="الكل"?"آخر الأخبار":category;$("status").textContent=filtered.length+" خبر";$("news").replaceChildren();for(let x of filtered){let a=el("article","");let h=el("div",x.category+" · "+x.source,"tag");let title=el("h2",x.title_ar||x.original_title);let p=el("p",(x.summary_ar||x.excerpt||"").slice(0,240));let row=el("div","","top");let b=el("button","اقرأ");b.onclick=()=>openNews(x);let f=el("button",fav.has(x.id)?"★":"☆");f.setAttribute("aria-label","المفضلة");f.onclick=()=>{fav.has(x.
