<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f5ef">
  <meta name="description" content="زامن، موجز عربي للأخبار والتقنية والذكاء الاصطناعي.">
  <title>زامن | ZAMEN</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <script>
    try {
      const theme = JSON.parse(localStorage.getItem('zamen-dark'));
      document.documentElement.classList.toggle('dark', theme ?? matchMedia('(prefers-color-scheme: dark)').matches);
    } catch {}
  </script>
  <link rel="stylesheet" href="styles.css?v=5">
  <script src="app.js?v=5" defer></script>
</head>
<body>
  <a class="skip" href="#main">انتقل إلى المحتوى</a>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="./">
        <img src="icon.svg" alt="" width="44" height="44">
        <span><strong>زامن</strong><span lang="en">ZAMEN</span></span>
      </a>
      <div class="edition"><time id="today"></time><time id="updated" hidden></time></div>
      <div class="tools">
        <button class="icon-button" id="searchToggle" aria-label="البحث" aria-controls="searchPanel" aria-expanded="false"></button>
        <button class="icon-button" id="theme" aria-label="المظهر الداكن" aria-pressed="false"></button>
        <button class="icon-button" id="sidebarToggle" aria-label="الأقسام" aria-controls="sidebar" aria-expanded="false"></button>
      </div>
    </div>
  </header>
  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <nav id="nav" aria-label="الأقسام"></nav>
    </aside>
    <main id="main" tabindex="-1">
      <form id="searchPanel" role="search" hidden>
        <label for="search">ابحث في الأخبار</label>
        <div class="search-row"><input id="search" name="q" type="search" enterkeyhint="search" autocomplete="off"><button type="submit">بحث</button></div>
      </form>
      <div id="status" class="sr-only" role="status"></div>
      <section id="feed" aria-labelledby="heading" aria-busy="true">
        <div class="section-head"><h1 id="heading">الرئيسية</h1><span id="count"></span></div>
        <div id="news"><div class="loading" aria-hidden="true"><div></div><div></div><div></div></div></div>
      </section>
      <section id="reader" class="reader" aria-label="قراءة المقال" hidden></section>
      <footer><a href="./">زامن</a><span>الأخبار من مصادرها الأصلية</span></footer>
    </main>
  </div>
  <nav id="bottom" class="bottom" aria-label="التنقل السريع"></nav>
</body>
</html>
